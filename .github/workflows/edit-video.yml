name: Edit video (trim & rotate/zoom) → R2
run-name: "${{ inputs.note != '' && format('{0} — ', inputs.note) || '' }}Edit video → ${{ inputs.tag }}"

# Server-side render of an edit made in the Trim & rotate editor
# (https://ryanifa.github.io/eoSwimming/edit.html). Give it the SOURCE video
# (an R2 key or a URL) and the "render-opdracht (EDL)" the editor gives you.
# The result is uploaded to the private R2 bucket and gets a private viewer link.
#
# Requires repo secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT,
# MEDIA_SIGNING_SECRET (the same secret the media Worker uses). See ARCHITECTURE.md.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Label for the run title so you can find it back later."
        required: false
        default: ""
      r2_key:
        description: "Source video already in R2 — its key, e.g. raw/Upload/Mijn.film.24.MOV. Leave empty to use a URL."
        required: false
        default: ""
      video_url:
        description: "…or a direct download URL of the SOURCE video (used only if r2_key is empty)."
        required: false
        default: ""
      edl:
        description: "Render-opdracht (EDL JSON) — copy it from the editor's 'Kopieer render-opdracht' button."
        required: true
      tag:
        description: "Share name for the result — R2 filename and ?k= link (e.g. heidi-50m-edit)."
        required: true
      folder:
        description: "R2 output folder / key prefix"
        required: false
        default: "swim/2026"

permissions:
  contents: read

env:
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_REGION: auto
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  BUCKET: media-private

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4          # needed for edit_video.py

      - name: Install ffmpeg + rclone
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Get the source video (from an R2 key or a URL)
        env:
          R2_KEY: ${{ inputs.r2_key }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -e
          R2_KEY="${R2_KEY%\"}"; R2_KEY="${R2_KEY#\"}"   # tolerate surrounding quotes
          R2_KEY="${R2_KEY%\'}"; R2_KEY="${R2_KEY#\'}"
          R2_KEY="${R2_KEY#/}"                            # and a leading slash
          if [ -n "$R2_KEY" ]; then
            echo "Fetching from R2: $R2_KEY"
            rclone copyto "r2:${BUCKET}/${R2_KEY}" source.mp4 -v
          elif [ -n "$VIDEO_URL" ]; then
            echo "Downloading from URL"
            curl -L --fail --max-time 900 -o source.mp4 "$VIDEO_URL"
          else
            echo "::error::Provide either r2_key or video_url."; exit 1
          fi
          ls -lh source.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name \
            -of default=noprint_wrappers=1 source.mp4 || true

      - name: Apply edit
        env:
          EDL: ${{ inputs.edl }}
        run: |
          echo "EDL: $EDL"
          # Keep the render-opdracht next to the result so the edit can always be
          # reproduced (uploaded to R2 and attached as an artifact below).
          printf '%s' "$EDL" > out.edl.json
          python3 edit_video.py source.mp4 out.mp4
          ls -lh out.mp4 out.edl.json

      - uses: actions/upload-artifact@v4     # a downloadable copy too (optional)
        with:
          name: edited-${{ inputs.tag }}
          path: |
            out.mp4
            out.edl.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload to R2 and build the private viewer link
        env:
          SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          FOLDER: ${{ inputs.folder }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          KEY="${FOLDER%/}/${TAG}.mp4"

          echo "Uploading -> r2:${BUCKET}/${KEY}"
          rclone copyto out.mp4 "r2:${BUCKET}/${KEY}" -v

          # Store the render-opdracht (EDL) next to the video so this edit can be
          # re-rendered later without redoing it in the editor.
          EDL_KEY="${FOLDER%/}/${TAG}.edl.json"
          echo "Uploading EDL -> r2:${BUCKET}/${EDL_KEY}"
          rclone copyto out.edl.json "r2:${BUCKET}/${EDL_KEY}" -v

          EXP=$(( $(date +%s) + 365*86400 ))
          SIG=$(printf '%s\n%s' "$KEY" "$EXP" \
            | openssl dgst -sha256 -hmac "$SIGNING_SECRET" -binary \
            | base64 | tr '+/' '-_' | tr -d '=')
          KEY_ENC=${KEY// /%20}
          VIEWER="https://ryanifa.github.io/eoSwimming/viewer.html?k=${KEY_ENC}&e=${EXP}&t=${SIG}"

          echo "Viewer: $VIEWER"
          {
            echo "### Bewerkte video klaar — privé viewer-link (365 dagen)"
            echo ""
            echo "[▶ Open in de frame viewer]($VIEWER)"
            echo ""
            echo "R2 object: \`${BUCKET}/${KEY}\`"
            echo "EDL (render-opdracht): \`${BUCKET}/${EDL_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
