name: Composite video with overlay (by swim ID) → R2
run-name: "${{ inputs.title }} · swim ${{ inputs.swim_id }} @ ${{ inputs.swim_start_seconds }}s"

# Renders the SwimBETTER sensor overlay onto the source video and uploads the
# result to the private R2 bucket with a private viewer link.
#
# Requires repo secrets: EO_EMAIL, EO_PASSWORD (sensor data) and
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, MEDIA_SIGNING_SECRET
# (the same secret the media Worker uses). See ARCHITECTURE.md.

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Label for this run — shows in the run name so you can find it back later (e.g. 'Jan 50m vrij')"
        required: true
        default: ""
      swim_id:
        description: "Swim ID to render (run 'Fetch swim by date' first to find it)"
        required: true
      r2_key:
        description: "Source video already in R2 — its key, e.g. raw/Upload/Mijn.film.24.MOV. Leave empty to use a URL."
        required: false
        default: ""
      video_url:
        description: "…or a direct download URL for the source video (used only if r2_key is empty)."
        required: false
        default: ""
      swim_start_seconds:
        description: "Seconds into the video where the swim begins (overlay aligns here)"
        required: true
        default: "0"
      show_forces:
        description: "Which force/velocity lines to draw, as a key=0/1 list. Keys: propulsive, totalForce, vertical, lateral, handVelocity. 1 = on, 0 = off."
        required: true
        default: "propulsive=1;totalForce=0;vertical=0;lateral=0;handVelocity=0"
      layout:
        description: "Overlay layout. default = paths right + chart bottom + readout top-left. mirrored = 180-degree flip: paths left + chart top + readout bottom-right."
        type: choice
        default: default
        options:
          - default
          - mirrored
      sides:
        description: "Which side(s) to draw (left = solid, right = dashed)"
        type: choice
        default: both
        options:
          - both
          - left
          - right
      overlay_content:
        description: "What to draw in the overlay. full = chart + hand-path panels + readout. speed_and_strokerate = ONLY speed (fixed, minutes/100m) and live stroke rate."
        type: choice
        default: full
        options:
          - full
          - speed_and_strokerate
      tag:
        description: "Share name for the result — R2 filename + ?k= link. Leave empty for composite-<swim_id>."
        required: false
        default: ""
      folder:
        description: "R2 output folder / key prefix"
        required: false
        default: "swim/2026"

permissions:
  contents: read

env:
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_REGION: auto
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  BUCKET: media-private

jobs:
  composite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show code version
        run: |
          echo "ref:     ${{ github.ref }}"
          echo "sha:     ${{ github.sha }}"
          git log -1 --format='%H%n%ci%n%s'
          md5sum render_overlay.py composite_video.py .github/workflows/composite-video.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + rclone
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - run: pip install -r requirements.txt

      - name: Fetch swim
        env:
          EO_EMAIL: ${{ secrets.EO_EMAIL }}
          EO_PASSWORD: ${{ secrets.EO_PASSWORD }}
          SWIM_ID: ${{ inputs.swim_id }}
        run: python fetch_one_swim.py

      - name: Get the source video (from an R2 key or a URL)
        run: |
          set -e
          mkdir -p input
          if [ -n "${{ inputs.r2_key }}" ]; then
            echo "Fetching from R2: ${{ inputs.r2_key }}"
            rclone copyto "r2:${BUCKET}/${{ inputs.r2_key }}" input/source.mp4 -v
          elif [ -n "${{ inputs.video_url }}" ]; then
            echo "Downloading from URL"
            curl -L --fail --max-time 600 -o input/source.mp4 "${{ inputs.video_url }}"
          else
            echo "::error::Provide either r2_key or video_url."; exit 1
          fi
          ls -lh input/
          ffprobe -v error -show_entries format=duration,size:stream=width,height -of default=noprint_wrappers=1 input/source.mp4

      - name: Locate swim directory
        run: |
          SWIM_DIR=$(ls -d data/*_${{ inputs.swim_id }} 2>/dev/null | head -1)
          if [ -z "$SWIM_DIR" ]; then
            echo "No data directory for swim ${{ inputs.swim_id }} (fetch failed?)." >&2
            exit 1
          fi
          echo "SWIM_DIR=$SWIM_DIR" >> "$GITHUB_ENV"
          echo "Using $SWIM_DIR"
          ls -1 "$SWIM_DIR"

      - name: Render overlay
        env:
          SHOW_FORCES: ${{ inputs.show_forces }}
          SHOW_LEFT: ${{ inputs.sides != 'right' }}
          SHOW_RIGHT: ${{ inputs.sides != 'left' }}
          OVERLAY_MODE: ${{ inputs.overlay_content }}
        run: python render_overlay.py "$SWIM_DIR" --fps 60 --layout "${{ inputs.layout }}"

      - name: Composite
        run: |
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 input/source.mp4)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 input/source.mp4)
          SCALE=$(python3 -c "print(round(${W:-1920}/1920.0, 4))")
          echo "video width=$W fps=$FPS -> overlay scale=$SCALE"
          python composite_video.py \
            --video input/source.mp4 \
            --overlay "$SWIM_DIR/overlay.mov" \
            --out "$SWIM_DIR/composite.mp4" \
            --swim-start ${{ inputs.swim_start_seconds }} \
            --overlay-scale $SCALE \
            --fps "$FPS"

      - uses: actions/upload-artifact@v4     # a downloadable copy too (optional)
        with:
          name: swim-composite-video
          path: |
            data/**/composite.mp4
            data/**/swim.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload to R2 and build the private viewer link
        env:
          SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
        run: |
          set -e
          FOLDER="${{ inputs.folder }}"
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="composite-${{ inputs.swim_id }}"
          KEY="${FOLDER%/}/${TAG}.mp4"

          echo "Uploading -> r2:${BUCKET}/${KEY}"
          rclone copyto "$SWIM_DIR/composite.mp4" "r2:${BUCKET}/${KEY}" -v

          EXP=$(( $(date +%s) + 365*86400 ))
          SIG=$(printf '%s\n%s' "$KEY" "$EXP" \
            | openssl dgst -sha256 -hmac "$SIGNING_SECRET" -binary \
            | base64 | tr '+/' '-_' | tr -d '=')
          KEY_ENC=${KEY// /%20}
          VIEWER="https://ryanifa.github.io/eoSwimming/viewer.html?k=${KEY_ENC}&e=${EXP}&t=${SIG}"

          echo "Viewer: $VIEWER"
          {
            echo "### Composite klaar — privé viewer-link (365 dagen)"
            echo ""
            echo "[▶ Open deze swim in de frame viewer]($VIEWER)"
            echo ""
            echo "R2 object: \`${BUCKET}/${KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
